<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Шкільний Веб-Квест</title>
    <!-- Tailwind CSS for modern, responsive styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter & Cinzel -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            user-select: none;
        }
        .cinzel-font {
            font-family: 'Cinzel', serif;
        }
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 15px rgba(244, 114, 182, 0.4); }
            50% { box-shadow: 0 0 30px rgba(244, 114, 182, 0.8); }
        }
        .glow-emerald {
            animation: pulse-glow 3s infinite;
        }
        @keyframes float-item {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        .float-anim {
            animation: float-item 4s ease-in-out infinite;
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.1);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(244, 114, 182, 0.4);
            border-radius: 4px;
        }
    </style>
</head>
<body class="bg-slate-950 text-pink-300 min-h-screen flex flex-col justify-between overflow-x-hidden">

    <div id="app" class="flex-grow flex flex-col items-center justify-center p-4 relative">
        
        <!-- Background Room Scene Overlay -->
        <div id="ambient-overlay" class="absolute inset-0 pointer-events-none transition-all duration-1000 z-0 bg-cover bg-center opacity-95"></div>
        <div id="ambient-gradient" class="absolute inset-0 pointer-events-none transition-colors duration-1000 z-0 bg-slate-950/20"></div>

        <!-- 1. AUTHORIZATION SCREEN -->
        <div id="auth-screen" class="relative z-10 w-full max-w-md bg-slate-900/90 backdrop-blur-md p-8 rounded-2xl border border-pink-900/50 shadow-2xl text-center">
            <div class="mb-6">
                <span class="text-5xl">⭐</span>
                <h1 class="text-3xl font-extrabold cinzel-font mt-2 bg-gradient-to-r from-pink-400 to-rose-400 bg-clip-text text-transparent">абобус</h1>
                <p class="text-base text-pink-300 font-semibold mt-3">абобус</p>
                <div class="mt-3 inline-block px-3 py-1 bg-pink-500/20 border border-pink-500/40 text-pink-300 rounded-full text-xs font-bold uppercase tracking-wide">
                    абобус
                </div>
            </div>
            
            <form id="auth-form" onsubmit="handleAuth(event)" class="space-y-4 text-left">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-pink-300 mb-1">абобус)</label>
                    <input type="text" id="fullname-input" placeholder="Наприклад: Шевченко Тарас" 
                           class="w-full px-4 py-3 bg-slate-800/90 border border-pink-900/60 rounded-xl focus:outline-none focus:ring-2 focus:ring-pink-500 text-pink-200 placeholder-pink-400/50 transition-all">
                    <p id="auth-error" class="text-pink-400 text-xs mt-1.5 hidden">абобус.</p>
                </div>
                <button type="submit" class="w-full py-3.5 bg-gradient-to-r from-pink-500 to-rose-600 hover:from-pink-600 hover:to-rose-700 text-pink-100 font-bold rounded-xl shadow-lg transition-all transform active:scale-95">
                    Розпочати квест
                </button>
            </form>
        </div>

        <!-- 2. GAMEPLAY ROOMS CONTAINER -->
        <div id="game-container" class="hidden relative z-10 w-full max-w-5xl flex flex-col space-y-4">
            
            <!-- Top HUD: Room title, Timer, Inventory & Player info -->
            <div class="bg-slate-900/80 backdrop-blur-md border border-pink-900/60 p-4 rounded-2xl flex flex-wrap justify-between items-center gap-4 shadow-xl">
                <div class="flex items-center space-x-3">
                    <div id="room-badge" class="px-3 py-1 bg-pink-500/20 border border-pink-500/40 text-pink-300 rounded-lg text-xs font-bold uppercase tracking-wider">абобус 1</div>
                    <h2 id="room-title" class="text-xl font-bold cinzel-font text-pink-200">абобус</h2>
                </div>
                
                <!-- Inventory & Timer -->
                <div class="flex items-center space-x-4">
                    <div class="flex items-center space-x-2 bg-slate-900/70 px-3 py-1.5 rounded-xl border border-pink-900/60">
                        <span class="text-xs text-pink-300 uppercase font-semibold">Інвентар:</span>
                        <div id="inventory-list" class="flex space-x-2">
                            <span class="text-xs text-pink-400/70 italic">Порожньо</span>
                        </div>
                    </div>
                    <div class="flex items-center space-x-2 bg-slate-900/70 px-3 py-1.5 rounded-xl border border-pink-900/60">
                        <span class="text-xs text-pink-300 uppercase font-semibold">Час:</span>
                        <span id="room-timer" class="text-sm font-mono font-bold text-pink-400">05:00</span>
                    </div>
                </div>
            </div>

            <!-- Interactive Room Workspace -->
            <div id="room-workspace" class="relative w-full h-[540px] rounded-3xl border border-pink-900/60 overflow-hidden shadow-2xl flex flex-col justify-between p-6 transition-all duration-700">
                
                <!-- Room Description / Prompt -->
                <div id="room-description" class="bg-slate-950/70 backdrop-blur-md p-4 rounded-2xl border border-pink-500/20 max-w-xl shadow-lg">
                    <p id="room-desc-text" class="text-sm text-pink-200 leading-relaxed font-medium"></p>
                </div>

                <!-- Clickable/Interactive Objects Layer -->
                <div id="objects-layer" class="relative flex-grow flex items-center justify-around flex-wrap gap-6 my-auto">
                    <!-- Dynamically populated via JavaScript -->
                </div>

                <!-- Room Navigation / Footer actions -->
                <div class="flex justify-between items-center pt-2 border-t border-pink-500/20 bg-slate-950/50 backdrop-blur-md px-4 py-2 rounded-xl">
                    <button onclick="showManualHint()" class="px-4 py-2 bg-slate-900/85 hover:bg-slate-800 border border-pink-900/80 rounded-xl text-xs font-semibold text-pink-300 transition flex items-center space-x-2 shadow">
                        <span>💡 Отримати підказку</span>
                    </button>
                    <div id="room-status-msg" class="text-xs font-semibold text-pink-300 animate-pulse drop-shadow"></div>
                </div>
            </div>
        </div>

        <!-- 3. VICTORY SCREEN -->
        <div id="victory-screen" class="hidden relative z-10 w-full max-w-lg bg-slate-900/90 backdrop-blur-md p-8 rounded-3xl border border-pink-900 shadow-2xl text-center">
            <div class="mb-4">
                <span class="text-6xl">🏆</span>
                <h1 class="text-3xl font-extrabold cinzel-font mt-3 bg-gradient-to-r from-pink-400 to-rose-400 bg-clip-text text-transparent">Перемога!</h1>
                <p id="victory-greeting" class="text-pink-200 mt-3 font-medium"></p>
            </div>
            <p class="text-sm text-pink-300 mb-6">Ти успішно пройшов(ла) практичне завдання на уроці інформатики, розгадав(ла) усі загадки та отримав(ла) 12 балів!</p>
            <button onclick="location.reload()" class="px-6 py-3 bg-gradient-to-r from-pink-500 to-rose-600 hover:from-pink-600 hover:to-rose-700 text-pink-100 font-bold rounded-xl shadow-lg transition-all">
                Пройти знову
            </button>
        </div>

    </div>

    <!-- MODAL / DIALOG WINDOW -->
    <div id="modal-backdrop" class="fixed inset-0 bg-black/75 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-pink-900/80 rounded-2xl max-w-md w-full p-6 shadow-2xl relative">
            <h3 id="modal-title" class="text-lg font-bold cinzel-font text-pink-200 mb-2">Загадка</h3>
            <div id="modal-text" class="text-sm text-pink-300 mb-4 leading-relaxed"></div>
            
            <div id="modal-content-area" class="mb-6">
                <!-- Dynamic inputs or images -->
            </div>

            <div class="flex justify-end space-x-3">
                <button onclick="closeModal()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-pink-300 rounded-xl text-xs font-semibold transition">Закрити</button>
                <button id="modal-action-btn" class="hidden px-4 py-2 bg-pink-600 hover:bg-pink-500 text-pink-100 rounded-xl text-xs font-bold transition">Підтвердити</button>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="relative z-10 py-3 text-center text-xs text-pink-400/60 border-t border-slate-900">
        Шкільний веб-квест • Урок інформатики © 2026
    </footer>

    <script>
        // Global Game State
        let player = {
            fullName: "",
            currentRoom: 1,
            inventory: [],
            roomTimerSeconds: 300, // 5 minutes per room
            timerInterval: null,
            playthroughCount: 0
        };

        const roomsData = {
            1: {
                id: 1,
                name: "Кімната Принцеси",
                badgeBg: "bg-pink-500/20 border-pink-500/40 text-pink-300",
                bgGradient: "from-pink-950/20 via-rose-950/20 to-slate-950/30",
                bgImage: "https://images.unsplash.com/photo-1513694203232-719a280e022f?auto=format&fit=crop&w=1600&q=80",
                description: "Яскрава кімната у пастельних тонах. Досліди декоративну квітку, щоб дізнатися кількість пелюсток для розгадки чарівного дзеркала!",
                autoHint: "Підказка: Спершу оглянь декоративну квітку на наявність підказки до дзеркала.",
                objects: []
            },
            2: {
                id: 2,
                name: "Містичний коридор",
                badgeBg: "bg-pink-500/20 border-pink-500/40 text-pink-300",
                bgGradient: "from-slate-900/20 via-pink-950/20 to-slate-950/30",
                bgImage: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=1600&q=80",
                description: "Прохолодний коридор зі світлом факелів. Досліди старий щоденник мандрівника на столі, щоб знайти секретне слово для книжкової шафи!",
                autoHint: "Підказка: Прочитай старий щоденник мандрівника на столі.",
                objects: []
            },
            3: {
                id: 3,
                name: "Середньовічне підземелля",
                badgeBg: "bg-pink-500/20 border-pink-500/40 text-pink-300",
                bgGradient: "from-stone-950/30 via-pink-950/30 to-neutral-950/35",
                bgImage: "https://images.unsplash.com/photo-1541701494587-cb58502866ab?auto=format&fit=crop&w=1600&q=80",
                description: "Похмура темниця з кам'яними стінами. Досліди настінний напис на кам'яній брилі, щоб дізнатися кодовий рік для залізного скрині!",
                autoHint: "Підказка: Уважно оглянь настінний напис на камінній стіні.",
                objects: []
            }
        };

        function initRoomsForPlaythrough() {
            const isHard = player.playthroughCount > 0;

            // Room 1 setup
            const p1 = isHard ? Math.floor(Math.random() * 5) + 7 : 5;
            roomsData[1].objects = [
                { 
                    id: "plant", 
                    name: "Декоративна квітка", 
                    icon: "🌸", 
                    type: "hint_source", 
                    solved: true, 
                    desc: isHard ? `Складний режим: Ти ретельно рахуєш кожну пелюстку магічної квітки. Точна кількість: **${p1}** пелюсток.` : `Ти розглядаєш ніжні пелюстки цієї декоративної квітки. На стеблі чітко вигравірувано число: **${p1}** пелюсток. Запам'ятай його для чарівного дзеркала!`, 
                    hint: `Уважно перерахуй пелюстки на квітці. Їх рівно ${p1}.` 
                },
                { 
                    id: "mirror", 
                    name: "Чарівне дзеркало", 
                    icon: "🪞", 
                    type: "puzzle", 
                    solved: false, 
                    desc: isHard ? `Дзеркало покрите морозним візерунком. Напис лунає: 'Скільки пелюсток на чарівній квітці?' Введи точне число:` : `На дзеркалі з'являється напис: 'Скільки пелюсток на чарівній квітці? Введи число':`, 
                    answer: p1.toString(), 
                    hint: "Перевір спершу Декоративну квітку!" 
                },
                { id: "teddy", name: "Плюшевий Ведмедик", icon: "🧸", type: "distractor", solved: false, desc: "М'який іграшковий ведмедик. Він солодко посміхається, але тут немає жодних підказок.", hint: "Це просто іграшка." },
                { id: "box", name: "Скринька з секретом", icon: "🎁", type: "inventory_item", requiredItem: null, givesItem: "Ключ від дверей", solved: false, desc: "Маленька рожева скринька. Відкривається після розгадки дзеркала!", hint: "Спочатку розгадай дзеркало!" },
                { id: "exit_door_1", name: "Двері до коридору", icon: "🚪", type: "exit", solved: false, desc: "Масивні кімнатні двері. Потрібно розгадати всі загадки та отримати ключ, щоб їх відчинити!", hint: "Виконай всі загадки та отримай ключ в інвентар!" }
            ];

            // Room 2 setup
            const words = isHard ? ["зорі", "темрява", "вітер", "полум'я"] : ["світло", "надія", "мрія", "сонце"];
            const chosenWord = words[Math.floor(Math.random() * words.length)];
            roomsData[2].objects = [
                { 
                    id: "diary", 
                    name: "Щоденник мандрівника", 
                    icon: "📜", 
                    type: "hint_source", 
                    solved: true, 
                    desc: isHard ? `У зашифрованому манускрипті ледь помітно виділено слово: '**${chosenWord}**'.` : `У розгорнутому щоденнику зазначено: 'У найтемніші часи лише одне слово рятує від мороку — це **${chosenWord}**'. Запам'ятай його для книжкової шафи!`, 
                    hint: `Щоденник чітко вказує на слово '${chosenWord}'.` 
                },
                { 
                    id: "bookshelf", 
                    name: "Книжкова шафа", 
                    icon: "📚", 
                    type: "puzzle", 
                    solved: false, 
                    desc: isHard ? `Магічний фоліант вимагає ввести закодоване в щоденнику слово ('${chosenWord}'):` : `Старий фоліант із шифром вимагає ввести слово з щоденника мандрівника ('${chosenWord}'). Введи відповідь українськими літерами:`, 
                    answer: chosenWord, 
                    hint: "Перевір спершу Щоденник мандрівника!" 
                },
                { id: "painting", name: "Моторошна картина", icon: "🖼️", type: "distractor", solved: false, desc: "Портрет незнайомця, чиї очі пильно слідкують за кожним твоїм кроком.", hint: "Це звичайна картина без підказок." },
                { id: "statue", name: "Кам'яна статуя", icon: "🗿", type: "inventory_item", requiredItem: null, givesItem: "Амулет часу", solved: false, desc: "Холодна фігура тримає блискучий амулет коридору.", hint: "Спочатку розгадай книжкову шафу!" },
                { id: "exit_door_2", name: "Двері до підземелля", icon: "🚪", type: "exit", solved: false, desc: "Двері до фінального підземелля. Потрібно розгадати загадку книжкової шафи та отримати амулет!", hint: "Виріши загадку книжкової шафи та відчини двері!" }
            ];

            // Room 3 setup
            const years = isHard ? ["2030", "2050", "2100", "2222"] : ["2026", "2027", "2025", "2024"];
            const chosenYear = years[Math.floor(Math.random() * years.length)];
            roomsData[3].objects = [
                { 
                    id: "wall_inscription", 
                    name: "Настінний напис", 
                    icon: "✍️", 
                    type: "hint_source", 
                    solved: true, 
                    desc: isHard ? `Висічений рунами напис шифрує рік випробування: **${chosenYear}** рік.` : `Висічений на стіні напис сповіщає: 'Рік великого визволення — **${chosenYear}**'. Запам'ятай його для залізної скрині!`, 
                    hint: `Напис на стіні вказує на рік ${chosenYear}.` 
                },
                { 
                    id: "chest", 
                    name: "Залізна скриня", 
                    icon: "🗝️", 
                    type: "puzzle", 
                    solved: false, 
                    desc: isHard ? `Замок заблоковано. Введи рік випробування ('${chosenYear}'):` : `На скрині кодовий замок. Введи рік визволення з настінного напису ('${chosenYear}'):`, 
                    answer: chosenYear, 
                    hint: "Перевір спершу Настінний напис!" 
                },
                { id: "torch", name: "Загадковий факел", icon: "🔥", type: "distractor", solved: false, desc: "Яскраво палає вогонь, зігріваючи це холодне підземелля.", hint: "Вогонь лише освітлює кімнату." },
                { id: "exit_door_3", name: "Вихід на волю", icon: "🚪", type: "exit", solved: false, desc: "Масивні ворота на свободу! Введи правильний код у залізну скриню, отримай Ключ Свободи та виходь!", hint: "Спочатку відчини залізну скриню за допомогою коду!" }
            ];
        }

        function handleAuth(event) {
            event.preventDefault();
            const inputVal = document.getElementById("fullname-input").value.trim();
            const errorEl = document.getElementById("auth-error");

            const ukrainianNameRegex = /^[А-ЩЬЮЯЄІЇҐ][а-щьюяєїіґ']+\s+[А-ЩЬЮЯЄІЇҐ][а-щьюяєїіґ']+$/u;

            if (!ukrainianNameRegex.test(inputVal)) {
                errorEl.classList.remove("hidden");
                return;
            }

            errorEl.classList.add("hidden");
            player.fullName = inputVal;
            
            document.getElementById("auth-screen").classList.add("hidden");
            document.getElementById("game-container").classList.remove("hidden");
            
            initRoomsForPlaythrough();
            loadRoom(1);
        }

        function loadRoom(roomNum) {
            player.currentRoom = roomNum;
            player.roomTimerSeconds = 300;
            clearInterval(player.timerInterval);
            startRoomTimer();

            const room = roomsData[roomNum];
            
            document.getElementById("room-badge").textContent = `Кімната ${roomNum}${player.playthroughCount > 0 ? ' (Складний режим ⚡)' : ''}`;
            document.getElementById("room-title").textContent = room.name;
            
            const ambientOverlay = document.getElementById("ambient-overlay");
            ambientOverlay.style.backgroundImage = `url('${room.bgImage}')`;
            
            document.getElementById("ambient-gradient").className = `absolute inset-0 pointer-events-none transition-colors duration-1000 z-0 bg-gradient-to-br ${room.bgGradient}`;
            document.getElementById("room-desc-text").textContent = room.description;
            document.getElementById("room-status-msg").textContent = "";

            renderObjects();
            updateInventoryUI();
        }

        function renderObjects() {
            const container = document.getElementById("objects-layer");
            container.innerHTML = "";
            const room = roomsData[player.currentRoom];

            room.objects.forEach(obj => {
                const btn = document.createElement("div");
                const isExit = obj.type === "exit";
                const borderClass = isExit ? 'border-pink-400 bg-slate-900/90 glow-emerald' : (obj.solved ? 'border-pink-500/60 opacity-90' : 'border-pink-900/70 hover:border-pink-500');
                
                btn.className = `cursor-pointer bg-slate-900/85 hover:bg-slate-900/95 backdrop-blur-md border ${borderClass} p-5 rounded-2xl flex flex-col items-center justify-center space-y-2 transition-all transform hover:scale-105 ${isExit ? '' : 'float-anim'} shadow-2xl min-w-[130px]`;
                btn.onclick = () => interactWithObject(obj);
                
                btn.innerHTML = `
                    <span class="text-4xl drop-shadow-md">${obj.icon}</span>
                    <span class="text-xs font-bold text-pink-200 text-center drop-shadow">${obj.name}</span>
                    ${obj.solved && !isExit && obj.type !== 'hint_source' ? '<span class="text-[10px] text-pink-400 font-bold">Розгадано ✓</span>' : ''}
                    ${isExit ? '<span class="text-[10px] text-pink-300 font-bold uppercase tracking-wider">Вихід 🚪</span>' : ''}
                `;
                container.appendChild(btn);
            });
        }

        function interactWithObject(obj) {
            const room = roomsData[player.currentRoom];

            if (obj.type === "distractor" || obj.type === "hint_source") {
                openModal(obj.name, obj.desc, false, null);
                return;
            }

            if (obj.type === "puzzle" || obj.type === "inventory_item") {
                if (obj.solved) {
                    openModal(obj.name, "Цей об'єкт уже розгадано або активовано.", false, null);
                    return;
                }

                let htmlContent = `<p class="mb-4">${obj.desc}</p>`;
                if (obj.answer) {
                    htmlContent += `
                        <input type="text" id="puzzle-answer-input" placeholder="Введіть відповідь..." class="w-full px-4 py-2.5 bg-slate-800 border border-pink-900 rounded-xl text-pink-200 focus:outline-none focus:ring-2 focus:ring-pink-500 mb-2">
                        <p id="puzzle-error" class="text-pink-400 text-xs hidden">Невірна відповідь. Спробуйте ще раз або скористайтеся підказкою!</p>
                    `;
                }

                openModal(obj.name, htmlContent, true, () => {
                    if (obj.answer) {
                        const userAnswer = document.getElementById("puzzle-answer-input").value.trim().toLowerCase();
                        if (userAnswer === obj.answer.toLowerCase()) {
                            obj.solved = true;
                            closeModal();
                            checkRoomCompletion();
                            renderObjects();
                        } else {
                            document.getElementById("puzzle-error").classList.remove("hidden");
                        }
                    } else {
                        obj.solved = true;
                        if (obj.givesItem) {
                            player.inventory.push(obj.givesItem);
                            updateInventoryUI();
                        }
                        closeModal();
                        checkRoomCompletion();
                        renderObjects();
                    }
                });
            }

            if (obj.type === "exit") {
                const allPuzzlesSolved = room.objects.filter(o => o.type === "puzzle").every(o => o.solved);
                
                if (allPuzzlesSolved) {
                    if (player.currentRoom < 3) {
                        loadRoom(player.currentRoom + 1);
                    } else {
                        triggerVictory();
                    }
                } else {
                    openModal("Двері замкнені 🚪", "Двері зачинені на магічний замок. Потрібно спочатку розгадати загадки в цій кімнаті!", false, null);
                }
            }
        }

        function checkRoomCompletion() {
            const room = roomsData[player.currentRoom];
            const puzzles = room.objects.filter(o => o.type === "puzzle");
            const allSolved = puzzles.every(p => p.solved);

            if (allSolved) {
                document.getElementById("room-status-msg").textContent = "✨ Усі загадки розгадано! Двері відчинено — натисни на них!";
                if (player.currentRoom === 1) {
                    const box = room.objects.find(o => o.id === "box");
                    if (box && !box.solved) {
                        box.solved = true;
                        player.inventory.push("Ключ від 2-ї кімнати");
                        updateInventoryUI();
                    }
                } else if (player.currentRoom === 2) {
                    const statue = room.objects.find(o => o.id === "statue");
                    if (statue && !statue.solved) {
                        statue.solved = true;
                        player.inventory.push("Амулет часу");
                        updateInventoryUI();
                    }
                } else if (player.currentRoom === 3) {
                    if (!player.inventory.includes("Ключ Свободи")) {
                        player.inventory.push("Ключ Свободи");
                        updateInventoryUI();
                    }
                }
            }
        }

        function updateInventoryUI() {
            const listEl = document.getElementById("inventory-list");
            if (player.inventory.length === 0) {
                listEl.innerHTML = `<span class="text-xs text-pink-400/70 italic">Порожньо</span>`;
                return;
            }
            listEl.innerHTML = player.inventory.map(item => `
                <span class="px-2 py-0.5 bg-pink-500/20 border border-pink-500/40 text-pink-300 rounded-lg text-xs font-semibold">${item}</span>
            `).join('');
        }

        function startRoomTimer() {
            const timerEl = document.getElementById("room-timer");
            player.timerInterval = setInterval(() => {
                player.roomTimerSeconds--;
                
                const mins = Math.floor(player.roomTimerSeconds / 60);
                const secs = player.roomTimerSeconds % 60;
                timerEl.textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;

                if (player.roomTimerSeconds <= 0) {
                    clearInterval(player.timerInterval);
                    showManualHint();
                }
            }, 1000);
        }

        function showManualHint() {
            const room = roomsData[player.currentRoom];
            openModal("Підказка системи 💡", room.autoHint, false, null);
        }

        function openModal(title, text, hasAction, actionCallback) {
            document.getElementById("modal-title").textContent = title;
            document.getElementById("modal-text").innerHTML = text;
            
            const actionBtn = document.getElementById("modal-action-btn");
            if (hasAction && actionCallback) {
                actionBtn.classList.remove("hidden");
                actionBtn.onclick = actionCallback;
            } else {
                actionBtn.classList.add("hidden");
            }

            document.getElementById("modal-backdrop").classList.remove("hidden");
        }

        function closeModal() {
            document.getElementById("modal-backdrop").classList.add("hidden");
        }

        function triggerVictory() {
            clearInterval(player.timerInterval);
            document.getElementById("game-container").classList.add("hidden");
            document.getElementById("victory-screen").classList.remove("hidden");
            document.getElementById("victory-greeting").textContent = `Вітаємо, ${player.fullName}!`;
            
            player.playthroughCount++;
            player.inventory = [];
        }
    </script>
</body>
</html>
